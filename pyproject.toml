[project]
name = "agent-eval"
version = "0.1.0"
description = "Offline evaluation framework for LangGraph agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "typer>=0.12",
    "openpyxl>=3.1",
    "pyarrow>=15.0"
]

[project.optional-dependencies]
# Run your agent to fill predictions (`agent-eval predict`) and the bundled examples:
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
# Text-to-SQL metrics (soft_f1, component_match, ast_valid, t2s_*):
t2s = ["sqlglot>=25.0"]
# BERTScore metric (semantic similarity to a reference answer):
bertscore = ["bert-score>=0.3"]
# Metric API server (FastAPI wrapper around the metrics; see docs/api-server.md):
server = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.scripts]
agent-eval = "agent_eval.cli.main:app"
agent-eval-serve = "agent_eval.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[dependency-groups]
# The test suite needs the t2s (sqlglot) + langgraph extras:
#   uv sync --extra t2s --extra langgraph
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer idiomatically uses Option/Argument constructors as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_eval"]
ignore_missing_imports = true
