[project]
name = "agent-eval"
version = "0.0.1"
description = "Reusable evaluation + runtime-critique framework for LangGraph agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "typer>=0.12",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
t2s = ["sqlglot>=25.0", "sqlalchemy>=2.0"]
deepeval = ["deepeval>=1.0"]
ragas = ["ragas>=0.2"]
agentevals = ["agentevals", "langgraph>=0.2", "langchain-core>=0.3"]
inspect = ["inspect-ai>=0.3"]
obs = ["opentelemetry-sdk>=1.27", "openinference-instrumentation-langchain>=0.1"]

[project.scripts]
agent-eval = "agent_eval.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[dependency-groups]
# The test suite needs the t2s (sqlglot) + agentevals (langgraph) extras:
#   uv sync --extra t2s --extra agentevals
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer idiomatically uses Option/Argument constructors as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_eval"]
ignore_missing_imports = true
