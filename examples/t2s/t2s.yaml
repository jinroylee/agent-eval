version: 1
agent_type: t2s

defaults:
  dialect: sqlite                          # SQL dialect for component_match / ast_valid parsing
  # Result-set comparison semantics for soft_f1 (the documented silent-failure source).
  result_set_policy: {row_order: ignore, duplicates: keep, nulls: distinct, float_tolerance: 1.0e-6}

# judge:                                   # optional real judge; omit -> deterministic offline stub
#   factory: examples/judges.py:claude_judge

datasets:
  gold:
    adapter: jsonl
    path: examples/t2s/gold.jsonl          # written by build_db.py: gold_sql + pre-computed result rows
    # gold_sql -> metadata['gold_sql']; gold_execution_result -> metadata['gold_execution_result'].
    field_map: {input: question, gold_sql: gold_sql, gold_execution_result: gold_execution_result}
  predictions:
    path: examples/t2s/predictions.jsonl    # always jsonl — no adapter needed

prediction:
  graph: examples/t2s/agent.py:graph
  source: gold
  target: predictions
  input_key: input
  generate_csv: true                      # also write predictions.csv for easy monitoring
  state_map:                              # canonical field <- agent state key
    sql: sql                              #   generated SQL -> metadata['sql']
    execution_result: execution_result    #   rows the agent's query returned -> metadata['execution_result']
    output: output                        #   final NL answer
    tokens: tokens

suites:
  correctness:                            # objective: graded on the result set + AST, never on a judge
    dataset: predictions
    metrics: [soft_f1, component_match, ast_valid]
    gate:
      thresholds: {soft_f1: 0.8, ast_valid: 0.95}
      require_pass: [soft_f1, ast_valid]
  response:                               # does the NL answer reflect what the query returned?
    dataset: predictions
    # Informational with the offline stub judge; wire a real judge (above) then add thresholds, e.g.
    #   gate: {thresholds: {t2s_faithfulness: 0.8}, require_pass: [t2s_faithfulness]}
    metrics: [t2s_faithfulness, t2s_consistency, llm_judge]
