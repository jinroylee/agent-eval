version: 1
agent_type: rag

defaults:
  k: 3                                     # fixed retrieval depth for recall@k / precision@k / ndcg@k

# judge:                                   # optional real judge; omit -> deterministic offline stub
#   factory: examples/judges.py:claude_judge

datasets:
  gold:
    adapter: jsonl
    path: examples/rag/gold.jsonl
    # relevant -> metadata['relevant_ids'] (gold); reference -> the gold answer.
    field_map: {input: question, expected: reference, relevant_ids: relevant}
  predictions:
    path: examples/rag/predictions.jsonl    # always jsonl — no adapter needed

prediction:
  graph: examples/rag/agent.py:graph
  source: gold
  target: predictions
  input_key: input
  generate_csv: true                      # also write predictions.csv for easy monitoring
  state_map:                              # canonical field <- agent state key
    retrieved_ids: retrieved_ids          #   ranked ids -> metadata['retrieved_ids']
    retrieved_context: retrieved_context  #   chunk texts (top-level field)
    output: output                        #   final answer
    tokens: tokens

suites:
  retrieval:                              # search quality — caps everything downstream
    dataset: predictions
    metrics: [recall_at_k, precision_at_k, ndcg_at_k]
    gate:
      thresholds: {recall_at_k: 0.7}      # the hard retrieval gate
      require_pass: [recall_at_k]
  response:                               # answer groundedness + quality
    dataset: predictions
    metrics: [faithfulness, consistency, llm_judge]
    gate:
      thresholds: {faithfulness: 0.6}
      require_pass: [faithfulness]
